<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>SAGE 2026 — Main Display</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   MAIN DISPLAY
========================================================= */

body {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   DIGITAL GRID
========================================================= */

.grid {

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .13;

    background-image:

        linear-gradient(
            rgba(0,210,255,.22) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,210,255,.22) 1px,
            transparent 1px
        );

    background-size:
        60px 60px;

    z-index: 2;

}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

.ambient {

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,
            rgba(0,140,255,.08),
            transparent 38%
        ),

        radial-gradient(
            circle at center,
            rgba(0,255,200,.035),
            transparent 65%
        );

    z-index: 1;

}


/* =========================================================
   CONNECTION STATUS
========================================================= */

.connection {

    position: fixed;

    top: 28px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 50;

    padding:
        8px 18px;

    border:
        1px solid
        rgba(0,210,255,.25);

    background:
        rgba(0,0,0,.55);

    color:
        rgba(255,255,255,.5);

    font-size: 10px;

    letter-spacing: 3px;

    text-align: center;

    white-space: nowrap;

}


/* =========================================================
   LOCK SCREEN
========================================================= */

.lock {

    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        #000;

    opacity: 1;

    visibility: visible;

    transition:
        opacity .8s ease,
        visibility .8s ease;

}


.lock.hide {

    opacity: 0;

    visibility: hidden;

}


.lock-content {

    position: relative;

    width: min(
        700px,
        90vw
    );

}


/* =========================================================
   LOCK ICON
========================================================= */

.lock-icon {

    position: relative;

    width: 130px;
    height: 130px;

    margin:
        0 auto 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(0,210,255,.3);

    border-radius: 50%;

    color: #00d9ff;

    font-size: 58px;

    box-shadow:

        0 0 20px
        rgba(0,210,255,.12),

        inset 0 0 25px
        rgba(0,210,255,.04);

    animation:
        lockPulse 3s ease-in-out infinite;

}


.lock-icon::before {

    content: "";

    position: absolute;

    inset: -18px;

    border:
        1px solid
        rgba(0,210,255,.15);

    border-radius: 50%;

    animation:
        rotateRing
        8s linear infinite;

}


.lock-icon::after {

    content: "";

    position: absolute;

    inset: -35px;

    border:
        1px dashed
        rgba(0,210,255,.08);

    border-radius: 50%;

    animation:
        rotateRingReverse
        14s linear infinite;

}


@keyframes lockPulse {

    0%,
    100% {

        transform:
            scale(.95);

        opacity: .55;

    }

    50% {

        transform:
            scale(1.05);

        opacity: 1;

    }

}


@keyframes rotateRing {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }

}


@keyframes rotateRingReverse {

    from {
        transform:
            rotate(360deg);
    }

    to {
        transform:
            rotate(0deg);
    }

}


/* =========================================================
   LOCK TITLE
========================================================= */

.lock-title {

    font-size:
        clamp(
            38px,
            6vw,
            76px
        );

    font-weight: 900;

    letter-spacing: 7px;

    color: #fff;

    text-shadow:

        0 0 12px
        rgba(255,255,255,.5),

        0 0 35px
        rgba(0,210,255,.45);

}


.lock-subtitle {

    margin-top: 18px;

    font-size:
        clamp(
            11px,
            1.3vw,
            15px
        );

    letter-spacing: 5px;

    color:
        rgba(255,255,255,.45);

}


.lock-line {

    width: 300px;

    max-width: 70vw;

    height: 1px;

    margin:
        28px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00d9ff,
            transparent
        );

    box-shadow:
        0 0 12px
        #00d9ff;

}


/* =========================================================
   AUTHENTICATING SCREEN
========================================================= */

.auth {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        rgba(0,0,0,.96);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .45s ease,
        visibility .45s ease;

}


.auth.active {

    opacity: 1;

    visibility: visible;

}


.auth-inner {

    width: min(
        900px,
        92vw
    );

}


/* =========================================================
   AUTH RINGS
========================================================= */

.auth-ring {

    position: relative;

    width:
        clamp(
            190px,
            25vw,
            300px
        );

    height:
        clamp(
            190px,
            25vw,
            300px
        );

    margin:
        0 auto 45px;

    border:
        2px solid
        rgba(0,217,255,.35);

    border-radius: 50%;

    box-shadow:

        0 0 25px
        rgba(0,217,255,.12),

        inset 0 0 30px
        rgba(0,217,255,.05);

    animation:
        authRotate
        5s linear infinite;

}


.auth-ring::before {

    content: "";

    position: absolute;

    inset: 22px;

    border:
        1px solid
        rgba(0,217,255,.65);

    border-radius: 50%;

}


.auth-ring::after {

    content: "";

    position: absolute;

    inset: 55px;

    border:
        1px dashed
        rgba(0,217,255,.5);

    border-radius: 50%;

}


.auth-core {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 65px;

    color: #00d9ff;

    text-shadow:

        0 0 15px #00d9ff,

        0 0 40px
        rgba(0,217,255,.7);

    animation:
        corePulse 1.4s
        ease-in-out infinite;

}


@keyframes authRotate {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


@keyframes corePulse {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(.85);

        opacity: .5;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.1);

        opacity: 1;

    }

}


/* =========================================================
   AUTH TEXT
========================================================= */

.auth-title {

    font-size:
        clamp(
            38px,
            6vw,
            72px
        );

    font-weight: 900;

    letter-spacing: 8px;

    color: #00d9ff;

    text-shadow:

        0 0 15px #00d9ff,

        0 0 45px
        rgba(0,217,255,.45);

    animation:
        textPulse 1.8s
        ease-in-out infinite;

}


.auth-small {

    margin-top: 20px;

    font-size:
        clamp(
            10px,
            1.5vw,
            16px
        );

    letter-spacing: 4px;

    color:
        rgba(255,255,255,.65);

    line-height: 1.7;

}


.auth-signal {

    margin-top: 28px;

    font-size: 10px;

    letter-spacing: 3px;

    color:
        rgba(0,217,255,.65);

}


.auth-signal::before {

    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 8px;

    border-radius: 50%;

    background: #00d9ff;

    box-shadow:
        0 0 12px
        #00d9ff;

    animation:
        signalBlink .8s
        infinite;

}


@keyframes textPulse {

    0%,
    100% {

        opacity: .55;

    }

    50% {

        opacity: 1;

    }

}


@keyframes signalBlink {

    0%,
    100% {

        opacity: .2;

    }

    50% {

        opacity: 1;

    }

}


/* =========================================================
   GRANTED SCREEN
========================================================= */

.granted {

    position: fixed;

    inset: 0;

    z-index: 30;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background: #000;

    opacity: 0;

    visibility: hidden;

}


.granted.active {

    opacity: 1;

    visibility: visible;

}


.granted-content {

    animation:

}


@keyframes grantedIn {

    from {

        opacity: 0;

        transform:
            scale(.65);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


.granted-symbol {

    width: 150px;
    height: 150px;

    margin:
        0 auto 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        2px solid
        #00ffae;

    border-radius: 50%;

    font-size: 90px;

    color: #00ffae;

    text-shadow:
        0 0 20px #00ffae,
        0 0 60px
        rgba(0,255,174,.7);

    box-shadow:

        rgba(0,255,174,.3),

        rgba(0,255,174,.08);

    animation:
        grantedPulse

}


@keyframes grantedPulse {

    0%,
    100% {

        transform:
            scale(.92);

    }

    50% {

        transform:

}


.granted-title {

    font-size:

            45px,

    letter-spacing: 8px;

    color: #00ffae;

    text-shadow:

        #00ffae,

        rgba(0,255,174,.55);

}


.granted-subtitle {

    margin-top: 18px;

    font-size: 12px;

    letter-spacing: 5px;

    color:
        rgba(255,255,255,.55);

}


/* =========================================================
   BANNER
========================================================= */

.banner {

    position: fixed;

    inset: 0;

    z-index: 40;

    background: #000;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 1.2s ease;

}


.banner.active {

    opacity: 1;

}


.banner-video {

    position: absolute;

    inset: 0;

    height: 100%;

}


/* =========================================================

========================================================= */

.banner::after {

}


/* =========================================================

========================================================= */

.audio-start {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    background:

        radial-gradient(
            circle at center,
            rgba(0,80,120,.12),
            #000 55%
        );

}


.audio-start.hide {

    display: none;

}


.audio-box {

    width:
        min(
            520px,
            90vw
        );

    padding:
        45px 35px;

    text-align: center;

    border:
        1px solid
        rgba(0,217,255,.3);

    background:
        rgba(0,10,16,.88);

    box-shadow:

        0 0 35px
        rgba(0,217,255,.08),

        inset 0 0 30px
        rgba(0,217,255,.025);

}


.audio-box h1 {

    margin: 0;

    font-size:
        clamp(
            28px,
            5vw,
            52px
        );

    letter-spacing: 5px;

    color: #00d9ff;

}


.audio-box p {

    margin:
        15px 0 30px;

    font-size: 10px;

    letter-spacing: 4px;

    color:
        rgba(255,255,255,.5);

}


.audio-box button {

    padding:
        14px 28px;

    border:
        1px solid
        #00d9ff;

    background:
        rgba(0,217,255,.05);

    color: white;

    font-size: 11px;

    letter-spacing: 3px;

    cursor: pointer;

    transition:
        .25s ease;

}


.audio-box button:hover {

    background:
        rgba(0,217,255,.15);

    box-shadow:
        0 0 20px
        rgba(0,217,255,.3);

}


/* =========================================================
   PARTICLES
========================================================= */

.particle {

    position: fixed;

    bottom: -10px;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #00d9ff;

    opacity: .35;

    z-index: 3;

    animation:
        particleMove
        linear infinite;

}


@keyframes particleMove {

    from {

        transform:
            translateY(0);

        opacity: 0;

    }

    15% {

        opacity: .4;

    }

    85% {

        opacity: .4;

    }

    to {

        transform:
            translateY(-110vh);

        opacity: 0;

    }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .connection {

        top: 14px;

        font-size: 7px;

        letter-spacing: 2px;

    }

    .lock-title {

        letter-spacing: 4px;

    }

    .lock-subtitle {

        letter-spacing: 3px;

    }

    .auth-title {

        letter-spacing: 4px;

    }

    .auth-small {

        letter-spacing: 2px;

    }

    .granted-title {

        letter-spacing: 4px;

    }

}

</style>

<script>

/* =========================================================

========================================================= */

const firebaseConfig = {

};


/* =========================================================
   FIREBASE
========================================================= */

let db = null;

let accessRef = null;

let firebaseReady = false;


try {

    firebase.initializeApp(
        firebaseConfig
    );

    db =
        firebase.database();

    /*
       Path mesti sama dengan
       index.html
    */

    accessRef =
        db.ref("safe/access");

    firebaseReady = true;

    console.log(
        "Firebase: ONLINE"
    );

}

catch (error) {

        "Firebase initialization error:",
        error
    );

}


/* =========================================================
   ELEMENTS
========================================================= */

const lockScreen =
    document.getElementById(
        "lockScreen"
    );

const authScreen =
    document.getElementById(
        "authScreen"
    );

const grantedScreen =
    document.getElementById(
        "grantedScreen"
    );

const banner =
    document.getElementById(
        "banner"
    );

const audioStart =
    document.getElementById(
        "audioStart"
    );

const activateAudio =
    document.getElementById(
        "activateAudio"
    );

const connection =
    document.getElementById(
        "connection"
    );

const authSmall =
    document.getElementById(
        "authSmall"
    );

const bannerVideo =
    document.getElementById(
        "bannerVideo"
    );


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

let approvedAudio = null;


/* =========================================================
   INITIALIZE AUDIO
========================================================= */

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


/* =========================================================
   SYNTHETIC TONE
========================================================= */

function tone(
    frequency,
    duration = .2,
    type = "sine",
    volume = .08
) {

    if (!audioContext)
        return;


    const oscillator =
        audioContext
            .createOscillator();

    const gain =
        audioContext
            .createGain();


    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(

        .001,

        audioContext.currentTime +
        duration

    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();

    oscillator.stop(

        audioContext.currentTime +
        duration

    );

}


/* =========================================================
   LOCK SOUND
========================================================= */

function lockSound() {

    tone(
        180,
        .15,
        "square",
        .08
    );


    setTimeout(
        () => {

            tone(
                120,
                .3,
                "sine",
                .05
            );

        },
        150
    );

}


/* =========================================================
   AUTHENTICATING SOUND
========================================================= */

function authenticateSound() {

    tone(
        500,
        .08,
        "square",
        .04
    );


    setTimeout(
        () => {

            tone(
                700,
                .08,
                "square",
                .05
            );

        },
        120
    );


    setTimeout(
        () => {

            tone(
                900,
                .1,
                "square",
                .04
            );

        },
        260
    );

}


/* =========================================================
   GRANTED SOUND
========================================================= */

function grantedSound() {

    tone(
        550,
        .12,
        "sine",
        .08
    );


    setTimeout(
        () => {

            tone(
                800,
                .12,
                "sine",
                .09
            );

        },
        130
    );


    setTimeout(
        () => {

            tone(
                1200,
                .4,
                "sine",
                .1
            );

        },
        260
    );

}


/* =========================================================
   PRELOAD APPROVED AUDIO
========================================================= */

function prepareApprovedAudio() {

    if (approvedAudio)
        return;


    approvedAudio =
        new Audio(
            "approved.mp3"
        );


    approvedAudio.preload =
        "auto";

    approvedAudio.volume =
        1;


    approvedAudio.load();

}


/* =========================================================
   PLAY APPROVED VOICE
========================================================= */

function playApprovedVoice() {

    return new Promise(
        resolve => {

            prepareApprovedAudio();


            if (!approvedAudio) {

                resolve(false);

                return;

            }


            approvedAudio.pause();

            approvedAudio.currentTime =
                0;


            approvedAudio.onended =
                () => {

                    resolve(true);

                };


            approvedAudio.onerror =
                error => {

                    console.warn(
                        "approved.mp3 tidak dapat dimainkan.",
                        error
                    );

                    resolve(false);

                };


            const playPromise =
                approvedAudio.play();


            if (playPromise) {

                playPromise.catch(
                    error => {

                        console.warn(
                            "approved.mp3 autoplay blocked.",
                            error
                        );

                        resolve(false);

                    }
                );

            }

        }
    );

}


/* =========================================================
   ACTIVATE DISPLAY
========================================================= */

activateAudio.addEventListener(
    "click",
    () => {

        /*
           Ini penting untuk membenarkan
           browser TV memainkan audio.
        */

        initAudio();

        lockSound();

        prepareApprovedAudio();


        /*
           Sembunyikan activation screen.
        */

        audioStart.classList.add(
            "hide"
        );


        connection.innerText =
            "SYSTEM READY";


        console.log(
            "Display activated."
        );

    }
);


/* =========================================================
   EVENT STATE
========================================================= */

let lastEventId = null;

let ceremonyRunning = false;


/*
   Masa display mula.

   Event lama tidak akan
   dimainkan semula ketika TV
   baru sahaja dibuka.
*/

const displayStartedAt =
    Date.now();


/* =========================================================
   RECEIVE ACCESS SIGNAL
========================================================= */

async function receiveAccessSignal(
    data = {}
) {

    /*
       Jangan proses dua kali.
    */

    if (ceremonyRunning)
        return;


    const eventId =
        data.eventId ||
        String(Date.now());


    /*
       Elak event yang sama
       dimainkan berulang kali.
    */

    if (
        eventId ===
        lastEventId
    ) {

        return;

    }


    lastEventId =
        eventId;


    ceremonyRunning =
        true;


    console.log(
        "ACCESS SIGNAL RECEIVED:",
        data
    );


    connection.innerText =
        "ACCESS SIGNAL RECEIVED";


    /* =====================================================
       STEP 1
       AUTHENTICATING
    ===================================================== */

    lockScreen.classList.add(
        "hide"
    );


    authScreen.classList.add(
        "active"
    );


    grantedScreen.classList.remove(
        "active"
    );


    banner.classList.remove(
        "active"
    );


    authSmall.innerText =
        "GESTURE SIGNAL RECEIVED";


    authenticateSound();


    /*
       Biometric processing
       animation.
    */

    await delay(
        1800
    );


    /* =====================================================
       STEP 2
       PALM BIOMETRIC SIGNAL RECEIVED
    ===================================================== */

    authSmall.innerText =
        "AUTHENTICATION PALM BIOMETRIC SIGNAL RECEIVED";


    connection.innerText =
        "PALM BIOMETRIC SIGNAL RECEIVED";


    /*
       Beri sedikit masa supaya
       mesej jelas kelihatan
       sebelum suara bermula.
    */

    await delay(
        500
    );


    /* =====================================================
       STEP 3
       PLAY approved.mp3
    ===================================================== */

    const voicePlayed =
        await playApprovedVoice();


    /*
       Jika audio gagal dimainkan,
       jangan hentikan ceremony.
    */

    if (!voicePlayed) {

        console.warn(
            "approved.mp3 gagal dimainkan. Teruskan ceremony."
        );

        await delay(
            1000
        );

    }


    /* =====================================================
       STEP 4
       ACCESS GRANTED
    ===================================================== */

    authScreen.classList.remove(
        "active"
    );


    grantedScreen.classList.add(
        "active"
    );


    connection.innerText =
        "AUTHENTICATION SUCCESSFUL";


    grantedSound();


    await delay(
        1800
    );


    /* =====================================================
       STEP 5
       BANNER VIDEO
    ===================================================== */

    grantedScreen.classList.remove(
        "active"
    );


    banner.classList.add(
        "active"
    );


    connection.innerText =
        "CEREMONY DISPLAY ACTIVE";


    /*
       Reset video.
    */

    bannerVideo.currentTime =
        0;


    /*
       Pastikan video tidak muted.
    */

    bannerVideo.muted =
        false;


    try {

        await bannerVideo.play();

    }

    catch (error) {

        console.warn(
            "Banner video autoplay blocked:",
            error
        );


        /*
           Fallback.

           Jika browser TV menghalang
           audio video, video masih
           boleh dimainkan secara muted.
        */

        try {

            bannerVideo.muted =
                true;

            await bannerVideo.play();

        }

        catch (fallbackError) {

            console.error(
                "Banner video failed:",
                fallbackError
            );

        }

    }

}


/* =========================================================
   DELAY HELPER
========================================================= */

function delay(
    milliseconds
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );

}


/* =========================================================
   FIREBASE LISTENER
========================================================= */

if (
    firebaseReady &&
    accessRef
) {

    accessRef.on(

        "value",

        snapshot => {

            const data =
                snapshot.val();


            if (!data)
                return;


            /*
               Hanya event OPENED.
            */

            if (
                data.status !==
                "opened"
            ) {

                return;

            }


            /*
               Event mesti mempunyai
               eventId.
            */

            if (!data.eventId)
                return;


            /*
               Semak timestamp.

               Event yang sudah wujud lama
               tidak dimainkan ketika TV
               baru dibuka.
            */

            const eventTime =
                Number(
                    data.timestamp ||
                    0
                );


            if (
                eventTime &&
                eventTime <
                (
                    displayStartedAt -
                    15000
                )
            ) {

                console.log(
                    "Old Firebase event ignored:",
                    data.eventId
                );

                return;

            }


            receiveAccessSignal(
                data
            );

        },

        error => {

            console.error(
                "Firebase listener error:",
                error
            );


            connection.innerText =
                "FIREBASE ERROR";

        }

    );

}

else {

    connection.innerText =
        "FIREBASE NOT READY";

}


/* =========================================================
   PARTICLES
========================================================= */

for (
    let i = 0;
    i < 50;
    i++
) {

    const particle =
        document.createElement(
            "div"
        );


    particle.className =
        "particle";


    particle.style.left =
        Math.random() *
        100 +
        "%";


    particle.style.animationDelay =
        Math.random() *
        7 +
        "s";


    particle.style.animationDuration =
        4 +
        Math.random() *
        7 +
        "s";


    document.body.appendChild(
        particle
    );

}


/* =========================================================
   INITIAL STATE
========================================================= */

lockScreen.classList.remove(
    "hide"
);

authScreen.classList.remove(
    "active"
);

grantedScreen.classList.remove(
    "active"
);

banner.classList.remove(
    "active"
);


connection.innerText =
    "SYSTEM STANDBY";


/* =========================================================
   VIDEO PRELOAD
========================================================= */

bannerVideo.load();


</script>
