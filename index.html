<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAFE 2026 — Gesture Controller</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020407;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
}

/* CAMERA */

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: .16;
    filter: grayscale(1) contrast(1.2);
}

/* DARK OVERLAY */

.overlay {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center,
            rgba(0,190,255,.10),
            transparent 35%),
        linear-gradient(
            rgba(0,0,0,.85),
            rgba(0,0,0,.96)
        );
    z-index: 2;
}

/* GRID */

.grid {
    position: fixed;
    inset: 0;
    z-index: 3;
    opacity: .15;
    background-image:
        linear-gradient(rgba(0,210,255,.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,210,255,.25) 1px, transparent 1px);
    background-size: 50px 50px;
}

/* HEADER */

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 88px;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 38px;

    background: rgba(0,0,0,.82);
    border-bottom: 1px solid rgba(0,210,255,.4);
}

.brand {
    font-size: 13px;
    letter-spacing: 3px;
    color: #00d9ff;
}

.title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);

    font-size: clamp(20px, 2.4vw, 34px);
    font-weight: 800;
    letter-spacing: 1px;
    text-align: center;
}

.system {
    font-size: 12px;
    letter-spacing: 2px;
}

.system::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 8px;
    border-radius: 50%;
    background: #00ffae;
    box-shadow: 0 0 12px #00ffae;
}

/* MAIN */

main {
    position: fixed;
    inset: 88px 0 0;
    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* SCANNER */

.scanner {
    position: relative;

    width: min(470px, 54vw);
    height: min(590px, 72vh);

    display: flex;
    align-items: center;
    justify-content: center;
}

/* HAND SVG */

.hand-svg {
    position: absolute;
    width: 100%;
    height: 100%;
}

.hand-shape {
    fill: rgba(0,150,220,.025);
    stroke: #00cfff;
    stroke-width: 2;
    filter:
        drop-shadow(0 0 8px rgba(0,210,255,.8))
        drop-shadow(0 0 30px rgba(0,150,255,.35));

    animation: handGlow 2s infinite alternate;
}

@keyframes handGlow {
    from {
        opacity: .45;
    }
    to {
        opacity: 1;
    }
}

/* SCAN LINE */

.scan-line {
    position: absolute;
    left: 17%;
    right: 17%;
    height: 3px;

    background: linear-gradient(
        90deg,
        transparent,
        #00d9ff,
        white,
        #00d9ff,
        transparent
    );

    box-shadow:
        0 0 10px #00d9ff,
        0 0 30px #00d9ff;

    animation: scanning 2.3s infinite ease-in-out;
}

@keyframes scanning {
    0% {
        top: 15%;
        opacity: .1;
    }

    50% {
        opacity: 1;
    }

    100% {
        top: 84%;
        opacity: .1;
    }
}

/* RADAR */

.radar {
    position: absolute;

    width: 230px;
    height: 230px;

    border: 1px solid rgba(0,210,255,.18);
    border-radius: 50%;

    animation: radarPulse 2s infinite;
}

.radar::before,
.radar::after {
    content: "";
    position: absolute;
    inset: 25px;

    border: 1px solid rgba(0,210,255,.15);
    border-radius: 50%;
}

@keyframes radarPulse {
    0%,100% {
        transform: scale(.85);
        opacity: .2;
    }

    50% {
        transform: scale(1);
        opacity: .8;
    }
}

/* CENTER */

.center-status {
    position: absolute;

    text-align: center;

    width: 100%;
    top: 45%;

    transform: translateY(-50%);

    pointer-events: none;
}

.icon {
    font-size: 52px;
    margin-bottom: 12px;

    filter:
        drop-shadow(0 0 15px #00d9ff);
}

.status-title {
    font-size: clamp(20px, 2.2vw, 30px);
    font-weight: 800;
    letter-spacing: 3px;
}

.status-subtitle {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .55;
}

/* LEFT STATUS PANEL */
.left-status-panel{position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:20;width:190px;display:flex;flex-direction:column;gap:10px}
.status-box{position:relative;min-height:70px;padding:12px 14px 12px 16px;background:linear-gradient(135deg,rgba(0,20,30,.88),rgba(0,0,0,.82));border:1px solid rgba(0,210,255,.28);border-left:3px solid rgba(0,210,255,.75);box-shadow:0 0 18px rgba(0,210,255,.06),inset 0 0 18px rgba(0,210,255,.025);text-align:left;font-size:9px;letter-spacing:1.8px;color:rgba(255,255,255,.58);overflow:hidden}
.status-box::after{content:"";position:absolute;top:0;right:0;width:28px;height:2px;background:#00d9ff;box-shadow:0 0 10px #00d9ff}
.status-box span{display:block;margin-top:7px;font-size:13px;font-weight:800;letter-spacing:1.4px;color:#00d9ff;text-shadow:0 0 8px rgba(0,217,255,.5)}
.status-label{display:flex;align-items:center;gap:7px}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor;flex:0 0 auto}
.status-box.camera-box{color:#00ffae}.status-box.camera-box span{color:#00ffae;text-shadow:0 0 8px rgba(0,255,174,.5)}
.status-box.hand-box{color:#ffca5c}.status-box.hand-box span{color:#ffca5c;text-shadow:0 0 8px rgba(255,202,92,.4)}
.status-box.gesture-box{color:#00d9ff}
.status-box.access-box{color:#ff5c68}.status-box.access-box span{color:#ff5c68;text-shadow:0 0 8px rgba(255,92,104,.45)}
@media(max-width:800px){.left-status-panel{left:10px;top:auto;bottom:18px;transform:none;width:155px;gap:6px}.status-box{min-height:54px;padding:8px 10px 8px 12px;font-size:7px;letter-spacing:1.2px}.status-box span{margin-top:4px;font-size:10px}}

/* ACCESS */

.access {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    opacity: 0;
    visibility: hidden;

    transition: .5s;
}

.access.active {
    opacity: 1;
    visibility: visible;
}

.access-content {
    text-align: center;

    animation: accessIn .8s ease;
}

@keyframes accessIn {
    from {
        opacity: 0;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.access-symbol {
    font-size: 100px;

    color: #00ffae;

    text-shadow:
        0 0 20px #00ffae,
        0 0 60px rgba(0,255,174,.6);
}

.access-title {
    margin-top: 20px;

    font-size: clamp(40px, 6vw, 80px);

    font-weight: 900;

    letter-spacing: 5px;

    color: #00ffae;
}

.access-subtitle {
    margin-top: 15px;

    letter-spacing: 4px;
    opacity: .7;
}

/* SOUND ENABLE */

.sound-button {
    position: fixed;
    right: 25px;
    bottom: 25px;

    z-index: 200;

    padding: 10px 16px;

    background: rgba(0,0,0,.8);

    border: 1px solid rgba(0,210,255,.4);

    color: white;

    cursor: pointer;

    font-size: 10px;

    letter-spacing: 1px;
}

/* PARTICLES */

.particle {
    position: fixed;

    width: 3px;
    height: 3px;

    background: #00d9ff;

    border-radius: 50%;

    opacity: .5;

    animation: particleMove 5s linear infinite;
}

@keyframes particleMove {

    from {
        transform: translateY(100vh);
    }

    to {
        transform: translateY(-20px);
    }

}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<div class="overlay"></div>
<div class="grid"></div>

<header>

    <div class="brand">
        SAFE / GESTURE CONTROL
    </div>

    <div class="title">
        PERASMIAN PROGRAM<br>
        SAFE SK ABANG GESA 2026
    </div>

    <div class="system">
        SYSTEM ONLINE
    </div>

</header>


<main>

    <div class="scanner">

        <div class="radar"></div>

        <svg
            class="hand-svg"
            viewBox="0 0 500 650"
            preserveAspectRatio="none">

            <path
                class="hand-shape"
                d="
                M250 625
                C205 625 165 605 145 575

</main>


<div class="left-status-panel" aria-label="System status">
    <div class="status-box camera-box"><div class="status-label"><span class="status-dot"></span>CAMERA ONLINE</div><span id="cameraStatus">STARTING</span></div>
    <div class="status-box hand-box"><div class="status-label"><span class="status-dot"></span>HAND STATUS</div><span id="handStatus">NOT DETECTED</span></div>
    <div class="status-box gesture-box"><div class="status-label"><span class="status-dot"></span>GESTURE</div><span id="gestureStatus">STANDBY</span></div>
    <div class="status-box access-box"><div class="status-label"><span class="status-dot"></span>ACCESS</div><span id="accessStatus">LOCKED</span></div>
</div>

    <div class="status-box">
        HAND
        <span id="handStatus">NOT DETECTED</span>
    </div>

    <div class="status-box">
        GESTURE
        <span id="gestureStatus">STANDBY</span>
    </div>

    <div class="status-box">
        ACCESS
        <span id="accessStatus">LOCKED</span>
    </div>

</div>


<button
    class="sound-button"

        </div>

            AKSES DIBUKA
        </div>

        <div class="access-subtitle">
            GESTURE VERIFIED
        </div>

    </div>

</div>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* =========================================================
   FIREBASE CONFIGURATION
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyDNlFEnA9ZGLFTFCuwMK5ZMzv3D8Ww2BAo",
  authDomain: "smppro-2845e.firebaseapp.com",
  databaseURL: "https://smppro-2845e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smppro-2845e",
  storageBucket: "smppro-2845e.firebasestorage.app",
  messagingSenderId: "488762363336",
  appId: "1:488762363336:web:da4ccbb41c1236eaf184fd",
  measurementId: "G-NZR5BXZKR1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const accessRef = db.ref("safe/access");


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("camera");

const cameraStatus =
    document.getElementById("cameraStatus");

const handStatus =
    document.getElementById("handStatus");

const gestureStatus =
    document.getElementById("gestureStatus");

const accessStatus =
    document.getElementById("accessStatus");

const statusTitle =
    document.getElementById("statusTitle");

const statusSubtitle =
    document.getElementById("statusSubtitle");

const accessScreen =
    document.getElementById("accessScreen");

const soundButton =
    document.getElementById("soundButton");


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

}


function tone(
    frequency,
    duration = .12,
    type = "sine",
    volume = .08
) {

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );

}


/* scanning sound */

function scanSound() {

    tone(
        700,
        .08,
        "square",
        .035
    );

}


/* verified */

function verifiedSound() {

    tone(
        600,
        .12,
        "sine",
        .08
    );

    setTimeout(() => {

        tone(
            1000,
            .18,
            "sine",
            .1
        );

    }, 130);

}


/* unlock */

function unlockSound() {

    tone(
        250,
        .12,
        "square",
        .1
    );

    setTimeout(() => {

        tone(
            450,
            .15,
            "square",
            .1
        );

    }, 120);

    setTimeout(() => {

        tone(
            900,
            .3,
            "sine",
            .12
        );

    }, 280);

}


soundButton.addEventListener(
    "click",
    () => {

        initAudio();

        tone(
            800,
            .15,
            "sine",
            .1
        );

        soundButton.innerText =
            "🔊 SOUND ACTIVE";

    }
);


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    facingMode: "user"

                },

                audio: false

            });


        video.srcObject =
            stream;


        cameraStatus.innerText =
            "ONLINE";


        initializeHands();

    }

    catch (error) {

        console.error(error);

        cameraStatus.innerText =
            "ERROR";

        statusTitle.innerText =
            "CAMERA ERROR";

        statusSubtitle.innerText =
            "PLEASE ALLOW CAMERA ACCESS";

    }

}


/* =========================================================
   MEDIAPIPE
========================================================= */

function initializeHands() {

    const hands =
        new Hands({

            locateFile: function(file) {

                return (
                    "https://cdn.jsdelivr.net/npm/" +
                    "@mediapipe/hands/" +
                    file
                );

            }

        });


    hands.setOptions({

        maxNumHands: 1,

        modelComplexity: 1,

        minDetectionConfidence: .6,

        minTrackingConfidence: .6

    });


    hands.onResults(
        onResults
    );


    const camera =
        new Camera(

            video,

            {

                onFrame:
                    async function() {

                        await hands.send({

                            image:
                                video

                        });

                    },

                width: 1280,

                height: 720

            }

        );


    camera.start();

}


/* =========================================================
   GESTURE
========================================================= */

let opened = false;

let palmStart = 0;

let lastScanSound = 0;


function onResults(results) {

    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        handStatus.innerText =
            "NOT DETECTED";

        gestureStatus.innerText =
            "STANDBY";

        statusTitle.innerText =
            "HAND SCANNER";

        statusSubtitle.innerText =
            "PLACE YOUR PALM INSIDE THE SCANNER";

        palmStart = 0;

        return;

    }


    const landmarks =
        results.multiHandLandmarks[0];


    handStatus.innerText =
        "DETECTED";


    const fingers =
        countOpenFingers(
            landmarks
        );


    if (fingers >= 4) {

        gestureStatus.innerText =
            "SCANNING";


        statusTitle.innerText =
            "ANALYZING PALM";


        statusSubtitle.innerText =
            "BIOMETRIC GESTURE ANALYSIS";


        const now =
            Date.now();


        if (
            now - lastScanSound >
            280
        ) {

            scanSound();

            lastScanSound =
                now;

        }


        if (!palmStart) {

            palmStart =
                now;

        }


        /*
           Tapak tangan perlu kekal
           selama 1.2 saat
        */

        if (
            now - palmStart >
            1200 &&
            !opened
        ) {

            openAccess();

        }

    }

    else {

        gestureStatus.innerText =
            "INVALID";

        statusTitle.innerText =
            "HAND DETECTED";

        statusSubtitle.innerText =
            "OPEN PALM REQUIRED";

        palmStart = 0;

    }

}


/* =========================================================
   COUNT FINGERS
========================================================= */

function countOpenFingers(points) {

    let count = 0;


    if (
        points[8].y <
        points[6].y
    ) count++;


    if (
        points[12].y <
        points[10].y
    ) count++;


    if (
        points[16].y <
        points[14].y
    ) count++;


    if (
        points[20].y <
        points[18].y
    ) count++;


    const thumbDistance =
        Math.hypot(

            points[4].x -
            points[5].x,

            points[4].y -
            points[5].y

        );


    const thumbBaseDistance =
        Math.hypot(

            points[3].x -
            points[5].x,

            points[3].y -
            points[5].y

        );


    if (
        thumbDistance >
        thumbBaseDistance
    ) {

        count++;

    }


    return count;

}


/* =========================================================
   OPEN ACCESS
========================================================= */

function openAccess() {

    opened = true;


    gestureStatus.innerText =
        "VERIFIED";


    accessStatus.innerText =
        "OPEN";


    statusTitle.innerText =
        "GESTURE VERIFIED";


    statusSubtitle.innerText =
        "ACCESS AUTHORIZED";


    verifiedSound();


    setTimeout(() => {

        unlockSound();

        accessScreen.classList.add(
            "active"
        );

    }, 500);


    /* =====================================================
   FIREBASE RTD
   Hantar isyarat kepada display.html
===================================================== */

const eventId = "safe_" + Date.now();

accessRef.set({
    status: "opened",
    eventId: eventId,
    timestamp: firebase.database.ServerValue.TIMESTAMP,
    source: "gesture-controller",
    ceremony: "SAFE SK ABANG GESA 2026"
}).then(() => {

    console.log("Firebase: access signal sent", eventId);

}).catch(error => {

    console.error("Firebase write error:", error);

});

}


/* =========================================================
   PARTICLES
========================================================= */

for (
    let i = 0;
    i < 35;
    i++
) {

    const p =
        document.createElement(
            "div"
        );

    p.className =
        "particle";

    p.style.left =
        Math.random() * 100 + "%";

    p.style.animationDelay =
        Math.random() * 5 + "s";

    p.style.animationDuration =
        3 + Math.random() * 6 + "s";

    document.body.appendChild(p);

}


/* =========================================================
   START
========================================================= */

startCamera();

</script>

</body>
